# Account Service REST endpoint base URL
account-service.base-url=${ACCOUNT_SERVICE_URL:http://neptune-account-service:8083}

# Disable RabbitMQ and Kafka auto-configuration in REST mode
spring.autoconfigure.exclude=\
  org.springframework.boot.autoconfigure.amqp.RabbitAutoConfiguration,\
  org.springframework.boot.autoconfigure.kafka.KafkaAutoConfiguration
