# ==============================================================================
# Account Service — Kafka Profile Configuration
# Project: Neptune Bank — IEEE Research
# Author: Ayshi Shannidhya Panda
# Activated by: --spring.profiles.active=kafka
# ==============================================================================

# Kafka Bootstrap Servers
spring.kafka.bootstrap-servers=${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

# Kafka Topic Names
kafka.topic.account.validation=account.validation
kafka.topic.account.debit=account.debit
kafka.topic.account.credit=account.credit
kafka.topic.transaction.events=transaction.events
kafka.topic.notification.events=notification.events
kafka.topic.audit.events=audit.events

# Kafka Consumer Configuration
kafka.consumer.group-id=neptune-account-group
kafka.consumer.concurrency=3

# Disable RabbitMQ auto-configuration in Kafka mode
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.amqp.RabbitAutoConfiguration
