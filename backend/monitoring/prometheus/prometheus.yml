# ==============================================================================
# Prometheus Scrape Configuration
# Project: Neptune Bank — IEEE Research
# Author: Ayshi Shannidhya Panda
# ==============================================================================

global:
  scrape_interval: 5s       # 5-second scrape interval for fine-grained metrics
  evaluation_interval: 5s
  scrape_timeout: 4s

scrape_configs:

  # ===========================
  # Spring Boot Microservices (via Actuator + Micrometer)
  # ===========================
  - job_name: 'neptune-auth-service'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['neptune-auth-service:8086']
        labels:
          service: 'auth-service'

  - job_name: 'neptune-user-service'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['neptune-user-service:8080']
        labels:
          service: 'user-service'

  - job_name: 'neptune-account-service'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['neptune-account-service:8083']
        labels:
          service: 'account-service'

  - job_name: 'neptune-transaction-service'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['neptune-transaction-service:8084']
        labels:
          service: 'transaction-service'

  - job_name: 'neptune-otp-service'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['neptune-otp-service:8082']
        labels:
          service: 'otp-service'

  - job_name: 'neptune-notification-service'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['neptune-notification-service:8087']
        labels:
          service: 'notification-service'

  - job_name: 'neptune-audit-service'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['neptune-audit-service:8088']
        labels:
          service: 'audit-service'

  # ===========================
  # Kafka Exporter (broker-level metrics)
  # ===========================
  - job_name: 'kafka-exporter'
    static_configs:
      - targets: ['neptune-kafka-exporter:9308']
        labels:
          service: 'kafka'

  # ===========================
  # cAdvisor (container-level CPU/memory)
  # ===========================
  - job_name: 'cadvisor'
    static_configs:
      - targets: ['neptune-cadvisor:8080']
        labels:
          service: 'cadvisor'

  # ===========================
  # Prometheus self-monitoring
  # ===========================
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
