spring.application.name=audit-service
server.port=8088

# Database
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:5432/AuditDB
spring.datasource.username=${DB_USER:neptune}
spring.datasource.password=${DB_PASS:ankit}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Kafka Configuration
spring.kafka.bootstrap-servers=${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
kafka.topic.audit.events=audit.events

# Actuator + Prometheus
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.prometheus.enabled=true
management.metrics.export.prometheus.enabled=true
